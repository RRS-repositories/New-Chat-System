  C.members.push(cmMake(U[id],{ringing:true}));
  renderCall();
  let dc=DB.convos.find(c=>c.type==='dm'&&!c.group&&c.members.includes(id));
  if(!dc){dc={id:'d-'+id,type:'dm',name:U[id].n,members:['you',id],joined:true,msgs:[]};DB.convos.push(dc);S.lastSeen[dc.id]=Date.now();S.unread[dc.id]=0}
  const im=M('you','Can you join my call?',0);im.ts=Date.now();im.callInvite=true;dc.msgs.push(im);
  if(!C.min&&S.cur===dc.id)renderMsgs(true);renderSide();
  toastIc('phone','Ringing <b>'+esc(U[id].n)+'</b>… · join link sent in your messages');
  cLater(()=>{
    const m=cm(id);if(!m||!C.active)return;
    m.ringing=false;chime(true);renderCall();
    toastIc('check','<b>'+esc(U[id].n)+'</b> answered and merged into the call');
  },3200+Math.random()*1600);
}
/* ---- recording ---- */
function postRecording(){
  const d=fmt((Date.now()-C.recStart)/1000);
  const c=conv(C.convoId);if(!c)return;
  const m=M('you','Meeting recording 🎙',0);m.ts=Date.now();m.file={n:'Call recording.m4a',s:d+' · Audio'};
  c.msgs.push(m);
  if(S.cur===C.convoId){renderMsgs();animLast()}
}
function toggleRec(){
  if(!C.rec){C.rec=true;C.recStart=Date.now();toastIc('rec','Recording started — <b>everyone in the call has been told</b>',{ms:4600})}
  else{C.rec=false;postRecording();toastIc('check','Recording saved to the conversation')}
  renderCPills();renderCallDock();
}
/* ---- whiteboard ---- */
function openBoard(){
  if(C.board){closeBoard();return}
  if(C.sharing&&C.sharing!=='you'){toastIc('share','<b>'+esc(cm(C.sharing).n)+'</b> is presenting — the board opens when they stop');return}
  if(C.sharing==='you')stopShare(true);
  C.board=true;renderCall();
  toastIc('pen','Whiteboard open — everyone in the call can draw');
  cLater(()=>simDraw(),3500);
}
function closeBoard(){C.board=false;renderCall();toastIc('pen','Whiteboard closed — the drawing is kept if you reopen it')}
function wbPt(e){return {x:e.offsetX/C.wbW,y:e.offsetY/C.wbH}}
function wbSeg(s,i){
  const ctx=C.wbCtx;if(!ctx||i<0)return;
  const a=s.points[i];let b=s.points[i+1]||{x:a.x+0.0004,y:a.y+0.0004};
  ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
  ctx.strokeStyle=s.color;ctx.lineWidth=s.size;
  ctx.beginPath();ctx.moveTo(a.x*C.wbW,a.y*C.wbH);ctx.lineTo(b.x*C.wbW,b.y*C.wbH);ctx.stroke();
  ctx.globalCompositeOperation='source-over';
}
function wbRedraw(){
  const ctx=C.wbCtx;if(!ctx)return;
  ctx.clearRect(0,0,C.wbW,C.wbH);
  C.boardStrokes.forEach(s=>{
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineWidth=s.size;
    ctx.beginPath();
    s.points.forEach((p,i)=>{const X=p.x*C.wbW,Y=p.y*C.wbH;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});
    if(s.points.length===1){const p=s.points[0];ctx.lineTo(p.x*C.wbW+0.4,p.y*C.wbH+0.4)}
    ctx.stroke();
  });
  ctx.globalCompositeOperation='source-over';
}
function syncTools(){
  document.querySelectorAll('.wb-sw').forEach(b=>b.classList.toggle('sel',!C.pen.eraser&&C.pen.color===b.dataset.c));
  document.querySelectorAll('.wb-sz').forEach(b=>b.classList.toggle('sel',!C.pen.eraser&&C.pen.size===+b.dataset.s));
  const er=document.querySelector('.wb-tl[data-t=eraser]');if(er)er.classList.toggle('sel',C.pen.eraser);
}
function initBoard(){
  const wrap=document.querySelector('.wb-wrap'),cv=$('wbC');if(!cv||!wrap)return;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=wrap.clientWidth,hgt=wrap.clientHeight;
  cv.width=w*dpr;cv.height=hgt*dpr;cv.style.width=w+'px';cv.style.height=hgt+'px';
  const ctx=cv.getContext&&cv.getContext('2d');if(!ctx)return;
  ctx.scale(dpr,dpr);ctx.lineCap='round';ctx.lineJoin='round';
  C.wbCtx=ctx;C.wbW=w;C.wbH=hgt;
  wbRedraw();
  let cur=null;
  cv.onpointerdown=e=>{try{cv.setPointerCapture(e.pointerId)}catch(x){}
    cur={erase:C.pen.eraser,color:C.pen.color,size:C.pen.eraser?C.pen.size*6:C.pen.size,points:[wbPt(e)]};
    C.boardStrokes.push(cur);wbSeg(cur,0)};
  cv.onpointermove=e=>{if(!cur)return;cur.points.push(wbPt(e));wbSeg(cur,cur.points.length-2)};
  const up=()=>{cur=null};cv.onpointerup=up;cv.onpointercancel=up;
  document.querySelectorAll('.wb-sw').forEach(b=>b.onclick=()=>{C.pen.color=b.dataset.c;C.pen.eraser=false;syncTools()});
  document.querySelectorAll('.wb-sz').forEach(b=>b.onclick=()=>{C.pen.size=+b.dataset.s;C.pen.eraser=false;syncTools()});
  document.querySelectorAll('.wb-tl').forEach(b=>b.onclick=()=>{const t=b.dataset.t;
    if(t==='eraser'){C.pen.eraser=!C.pen.eraser;syncTools()}
    if(t==='undo'){C.boardStrokes.pop();wbRedraw()}
    if(t==='clear'){C.boardStrokes=[];wbRedraw();toastIc('check','Board cleared')}
  });
  const cl=document.querySelector('.wb-close');if(cl)cl.onclick=closeBoard;
}
function simDraw(){
  if(!C.board||!C.active)return;
  const pts=[];
  for(let a=-0.4;a<=Math.PI*2;a+=0.2)pts.push({x:0.76+0.07*Math.cos(a),y:0.26+0.11*Math.sin(a)});
  pts.push({x:0.71,y:0.27},{x:0.75,y:0.32},{x:0.82,y:0.2});
  const s={erase:false,color:'#E0507A',size:4,points:[]};
  C.boardStrokes.push(s);
  const cur=$('wbCur');if(cur){cur.style.display='block';cur.textContent='Brad'}
  let i=0;
  const iv=setInterval(()=>{
    if(!C.board||!C.active||i>=pts.length){clearInterval(iv);const c2=$('wbCur');if(c2)c2.style.display='none';return}
    s.points.push(pts[i]);wbSeg(s,s.points.length-2);
    const c3=$('wbCur');if(c3){c3.style.left=(pts[i].x*100)+'%';c3.style.top=(pts[i].y*100)+'%'}
    i++;
  },42);
  C.tos.push(iv);
}
$('ccBoard').onclick=openBoard;
$('ccRec').onclick=toggleRec;
$('ccRooms').onclick=()=>toggleBoPanel();
$('ccAdd').onclick=e=>{e.stopPropagation();openAddMenu($('ccAdd'))};
$('boClose').onclick=()=>{$('bopanel').classList.remove('on');renderCallDock()};
window.addEventListener('resize',()=>{if(C.active&&!C.min&&(C.board||C.sharing))renderCall()});
function openCallMenu(anchor,id){
  closeFloat();
  const m=cm(id);if(!m)return;
  const iAmHost=C.host==='you';
  const el=document.createElement('div');el.className='cmenu';
  let h='';
  if(m.ringing){h+=`<button class="danger" data-a="cring">${I.phonedn}<span>Stop ringing ${esc(m.n.split(' ')[0])}</span></button>`}
  else if(m.id==='you')h+=`<button data-a="mute">${C.you.muted?I.mic:I.micoff}<span>${C.you.muted?'Unmute':'Mute'} yourself</span></button>`;
  else if(iAmHost){
    h+= m.muted?`<button disabled>${I.mic}<span>Unmute</span></button><div class="hint">Hosts can\u2019t unmute anyone — ${esc(m.n.split(' ')[0])} unmutes themselves.</div>`
      :`<button data-a="hmute">${I.micoff}<span>Mute ${esc(m.n.split(' ')[0])}</span></button>`;
    h+=`<button class="danger" data-a="hrem">${I.userx}<span>Remove from call</span></button>`;
  } else h+=`<div class="hint">${esc(U[C.host]?U[C.host].n.split(' ')[0]:'The host')} started this call — host controls are theirs.</div>`;
  el.innerHTML=h;
  document.body.appendChild(el);
  const r=anchor.getBoundingClientRect();
  el.style.left=Math.max(8,Math.min(r.left,innerWidth-el.offsetWidth-10))+'px';
  let y=r.bottom+6;if(y+el.offsetHeight>innerHeight-10)y=r.top-el.offsetHeight-6;
  el.style.top=y+'px';el.onclick=e=>e.stopPropagation();
  el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;closeFloat();
    if(a==='mute')toggleCMic();
    if(a==='cring'){C.members=C.members.filter(x=>x.id!==id);renderCall();toastIc('phonedn','Stopped ringing '+esc(m.n.split(' ')[0]))}
    if(a==='hmute'){m.muted=true;m.speaking=false;renderCall();toastIc('micoff','<b>'+esc(m.n)+'</b> was muted — they can unmute themselves');cLater(()=>{if(cm(id)&&cm(id).muted){cm(id).muted=false;renderCall();toastIc('mic','<b>'+esc(m.n.split(' ')[0])+'</b> unmuted themselves')}},12000)}
    if(a==='hrem'){C.members=C.members.filter(x=>x.id!==id);if(C.sharing===id)C.sharing=null;allGroups().forEach(g=>g.ids=g.ids.filter(x=>x!==id));if(C.bo&&!C.bo.groups.some(g=>g.ids.length)){C.bo=null;renderCPills()}renderBoPanel();chime(false);renderCall();toastIc('userx','<b>'+esc(m.n)+'</b> was removed from the call');
      cLater(()=>{if(C.active&&!cm(id))toastAct('<b>'+esc(m.n)+'</b> is asking to join the call',[{label:'Admit',kind:'ok',fn:()=>{if(C.members.length>=8){toastIc('bell','Calls hold up to 8 people');return}C.members.push(cmMake(U[id]));boAdopt(id);chime(true);renderCall()}},{label:'Refuse',kind:'no'}],'phone')},6000)}
  });
  floatEl=el;
}
function toggleCMic(){C.you.muted=!C.you.muted;const me=cm('you');me.muted=C.you.muted;me.speaking=false;renderCall()}
$('ccMic').onclick=toggleCMic;
$('miMic').onclick=toggleCMic;
function stopShare(silent){
  if(C.stream){try{C.stream.getTracks().forEach(t=>t.stop())}catch(e){}C.stream=null}
  if(C.sharing==='you')C.sharing=null;
  renderCall();
  if(!silent)toastIc('share','You stopped sharing');
}
$('ccShare').onclick=async()=>{
  if(C.sharing&&C.sharing!=='you'){toastIc('share','<b>'+esc(cm(C.sharing).n)+'</b> is already sharing — one screen at a time');return}
  if(C.sharing==='you'){stopShare();return}
  let real=false;
  try{
    if(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia){
      C.stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});
      real=true;
      const tr=C.stream.getVideoTracks()[0];
      if(tr)tr.onended=()=>stopShare();
    }
  }catch(e){C.stream=null}
  C.sharing='you';renderCall();
  toastIc('share', real
    ?'You\u2019re sharing your screen — live capture, with your self-preview bottom right'
    :'Live capture isn\u2019t permitted in this preview, so a demo screen stands in — the real app shares your actual screen',{ms:5200});
};
$('ccHand').onclick=()=>{C.you.hand=!C.you.hand;cm('you').hand=C.you.hand;renderCall();if(C.you.hand&&C.host!=='you')toastIc('hand','Your hand is raised — the host can see it')};
(function(){const p=$('crpick');p.innerHTML=EMO.map(e=>`<button>${e}</button>`).join('');
  p.querySelectorAll('button').forEach(b=>b.onclick=()=>{cReact(b.textContent,cm('you'));p.classList.remove('on')});
  $('ccReact').onclick=e=>{e.stopPropagation();p.classList.toggle('on')};
  document.addEventListener('click',e=>{if(!e.target.closest('#crpick')&&!e.target.closest('#ccReact'))p.classList.remove('on')});
})();
function cReact(e,from){
  if(!from)return;
  const el=document.createElement('span');el.className='remoji';
  el.style.left=(8+Math.random()*26)+'%';el.style.setProperty('--dx',(Math.random()*60-30)+'px');
  el.innerHTML=e+'<small>'+esc(from.n.split(' ')[0])+'</small>';
  $('crlayer').appendChild(el);el.addEventListener('animationend',()=>el.remove());
}
$('cMin').onclick=()=>{C.min=true;$('callov').classList.remove('on');$('mini').classList.add('on');$('miName').textContent=$('cName').textContent};
$('miExp').onclick=()=>{C.min=false;$('mini').classList.remove('on');$('callov').classList.add('on');renderCall()};
$('miHang').onclick=()=>endCall(null,true);
$('ccLeave').onclick=()=>endCall(null,true);
function endCall(msg,summary){
  const secs=C.startedAt?(Date.now()-C.startedAt)/1000:0;
  const ppl=C.members.length;const cid=C.convoId;
  const wasActive=C.phase==='active';
  if(C.rec&&wasActive){postRecording()}
  cClear();C.active=false;C.sharing=null;
  C.rec=false;C.board=false;C.boardStrokes=[];C.bo=null;renderCPills();
  $('bopanel').classList.remove('on');BO.groups=[];
  $('callov').classList.remove('on');$('mini').classList.remove('on');$('crlayer').innerHTML='';
  if(summary&&wasActive&&secs>0)postCallMsg(cid,'Voice call · '+fmt(secs)+(ppl>1?' · '+ppl+' people':''));
  else if(msg)postCallMsg(cid,msg);
  chime(false);
  C.phase=null;
}
function postCallMsg(cid,text){
  const c=conv(cid);if(!c)return;
  c.msgs.push(Object.assign(M('you',text,0),{ts:Date.now(),sys:true}));
  if(S.cur===cid){renderMsgs();animLast()}
}

/* ============ Ambient life ============ */
setInterval(()=>{
  if(document.hidden)return;
  if(Math.random()<.5)return;
  const pool=['general','announcements'];const cid=pick(pool);
  const c=conv(cid);const who=pick(c.members.filter(x=>x!=='you'&&U[x].p==='on'));
  if(!who)return;
  c.msgs.push(Object.assign(M(who,pick(REPLIES[who]),0),{ts:Date.now()}));
  if(S.cur===cid){renderMsgs(true);animLast();ding()}else incoming(cid,who);
},52000);

/* ============ Keyboard ============ */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){$('sov').classList.remove('on');closeModal();closeFloat();if(S.panel){S.panel=null;$('panel').classList.remove('on');renderHead()}}
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();$('btnSearch').click()}
});

/* ============ Boot ============ */
renderSide();renderHead();renderMsgs();
later(()=>toastIc('bell','Tip — press <b>⌘K</b> or use the search bar. It works.',{ms:5200}),1400);
</script>
