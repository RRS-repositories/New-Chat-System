<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Chat — Rowan Rose · Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ================= Tokens ================= */
:root{
  --side:#171B38; --side-2:#12152C; --side-hi:rgba(255,255,255,.07);
  --paper:#FFFFFF; --paper-2:#F6F6FC; --paper-3:#EDEEF8;
  --ink:#171A2E; --mut:#696F8E; --dim:#9CA1BE;
  --line:#EAEBF4; --line-2:#DEE0EF;
  --hov:#F8F8FD; --glass:rgba(255,255,255,.86); --glass-2:rgba(255,255,255,.93);
  --violet:#6C4DE6; --violet-2:#8F76F5; --violet-3:#B9A6FF; --violet-ink:#4A31B8; --vrgb:108,77,230;
  --grad:linear-gradient(120deg,#8F76F5 0%,#6C4DE6 55%,#5B3BDF 100%);
  --violet-soft:#F2EEFF; --violet-soft-2:#E7E0FF;
  --green:#1FA75A; --amber:#E8930C; --red:#E5484D;
  --dk:#0B0E20; --dk-2:#141836; --dk-glass:rgba(19,23,52,.76); --dk-line:rgba(255,255,255,.1); --dk-text:#F3F4FB; --dk-mut:#9AA3C7;
  --sh:0 12px 38px -14px rgba(23,27,56,.30);
  --sh-sm:0 5px 18px -7px rgba(23,27,56,.26);
  --sh-lg:0 32px 90px -24px rgba(12,15,34,.55);
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.55'/></svg>");
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; background:var(--paper-2); color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--violet-2);outline-offset:2px;border-radius:8px}
svg{display:block}
::selection{background:rgba(var(--vrgb),.22)}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:rgba(110,116,150,.28);border-radius:8px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(var(--vrgb),.45);border:3px solid transparent;background-clip:content-box}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

#app{height:100%;display:flex;overflow:hidden}

/* ================= Sidebar ================= */
#side{
  width:274px;flex:0 0 auto;display:flex;flex-direction:column;color:#C6CBE7;position:relative;isolation:isolate;
  background:linear-gradient(180deg,var(--side) 0%,var(--side-2) 100%);
}
#side::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(420px 260px at 18% -6%, rgba(124,92,255,.34), transparent 62%),
             radial-gradient(360px 300px at 110% 108%, rgba(var(--vrgb),.14), transparent 60%);}
#side::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.05;background-image:var(--noise)}
.s-brand{display:flex;align-items:center;gap:10px;padding:16px 14px 12px;flex:0 0 auto}
.s-logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:0 0 auto;
  background:var(--grad);box-shadow:0 8px 20px -6px rgba(var(--vrgb),.75), inset 0 1px 0 rgba(255,255,255,.35)}
.s-logo svg{width:17px;height:17px}
.s-brand .bn{flex:1;min-width:0}
.s-brand .bn b{display:block;color:#fff;font-size:15px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.s-brand .bn span{font-size:11px;color:#8B92BF;font-weight:600}
.s-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#AEB4DB;flex:0 0 auto;transition:background .14s,color .14s}
.s-ic:hover{background:var(--side-hi);color:#fff}
.s-ic svg{width:17px;height:17px}
.s-search{margin:0 12px 10px;flex:0 0 auto}
.s-search button{
  width:100%;display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:12px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);color:#9BA2CB;font-size:12.5px;font-weight:600;
  transition:background .15s,border-color .15s,color .15s;
}
.s-search button:hover{background:rgba(255,255,255,.1);border-color:rgba(143,118,245,.5);color:#E6E8FA}
.s-search svg{width:14px;height:14px}
.s-search .kbd{margin-left:auto;font-size:10px;font-weight:800;border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:2px 6px;color:#7F86B4}
.s-scroll{flex:1;overflow-y:auto;padding:2px 10px 12px;min-height:0}
.s-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border:3px solid transparent;background-clip:content-box}
.s-sec{display:flex;align-items:center;gap:6px;width:100%;padding:10px 8px 6px;color:#848BB8;font-size:11px;font-weight:800;letter-spacing:.05em}
.s-sec svg{width:11px;height:11px;transition:transform .15s}
.s-sec .cnt{margin-left:auto;background:var(--grad);color:#fff;font-size:10.5px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 5px;box-shadow:0 4px 10px -3px rgba(var(--vrgb),.7)}
.s-item{
  display:flex;align-items:center;gap:9px;width:100%;padding:7.5px 9px;border-radius:11px;
  color:#C6CBE7;font-size:13.5px;font-weight:500;text-align:left;position:relative;margin:1px 0;
  transition:background .13s,color .13s;
}
.s-item:hover{background:var(--side-hi);color:#fff}
.s-item.on{
  background:var(--grad);color:#fff;font-weight:600;
  box-shadow:0 8px 22px -8px rgba(var(--vrgb),.85), inset 0 1px 0 rgba(255,255,255,.22);
}
.s-item .hash{width:16px;height:16px;flex:0 0 auto;opacity:.7}
.s-item.on .hash{opacity:1}
.s-item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-item.unrd{color:#fff;font-weight:700}
.s-item .ubdg{background:var(--grad);color:#fff;font-size:10.5px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;box-shadow:0 4px 10px -3px rgba(var(--vrgb),.7)}
.s-item.on .ubdg{background:rgba(255,255,255,.26);box-shadow:none}
.s-bot{flex:0 0 auto;padding:8px 10px 10px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:1px;position:relative}
.s-bitem{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:10px;font-size:12.8px;font-weight:500;color:#A7ADD6;width:100%;text-align:left;transition:background .13s,color .13s}
.s-bitem:hover{background:var(--side-hi);color:#fff}
.s-bitem svg{width:15px;height:15px}
.s-me{
  display:flex;align-items:center;gap:10px;width:100%;margin-top:7px;padding:9px 10px;border-radius:13px;text-align:left;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);transition:background .15s,border-color .15s;
}
.s-me:hover{background:rgba(255,255,255,.09);border-color:rgba(143,118,245,.45)}
.s-me .nm{min-width:0;flex:1}
.s-me .nm b{display:block;color:#fff;font-size:13px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-me .nm span{font-size:11px;color:#8B92BF;font-weight:600}
.s-me .gear{color:#8B92BF}
.s-me .gear svg{width:15px;height:15px}
.s-av{position:relative;flex:0 0 auto}
.s-av .pd{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2.5px solid #181C39;box-shadow:0 0 8px rgba(46,213,115,.8)}
/* avatar */
.uav{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12.5px;user-select:none;position:relative;
  background:radial-gradient(130% 130% at 28% 18%, hsl(var(--h) 62% 56%), hsl(var(--h) 58% 34%));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 4px 10px -4px hsl(var(--h) 60% 35% / .65)}
.uav.sm{width:22px;height:22px;border-radius:7px;font-size:9.5px}
.uav.md{width:28px;height:28px;border-radius:9px;font-size:11px}
.uav.lg{width:44px;height:44px;border-radius:14px;font-size:16px}
.dmav{position:relative}
.dmav .pd{position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;border:2px solid var(--side)}
.pd.on{background:var(--green);box-shadow:0 0 7px rgba(46,213,115,.75)}
.pd.away{background:var(--amber)}
.pd.off{background:#5A608A;box-shadow:none}

/* ================= Main ================= */
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--paper);position:relative}
.m-head{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 16px;height:60px;z-index:10;
  border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);
}
.m-burger{display:none;width:36px;height:36px;border-radius:10px;place-items:center;color:var(--mut)}
.m-burger:hover{background:var(--paper-2)}
.m-burger svg{width:18px;height:18px}
.ch-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--violet-soft);color:var(--violet-ink);box-shadow:inset 0 1px 0 #fff}
.ch-ic svg{width:16px;height:16px}
.m-title{min-width:0;flex:1}
.m-title .r1{display:flex;align-items:center;gap:7px;font-weight:800;font-size:15px;letter-spacing:-.015em}
.m-title .r1 .pd{position:static;width:9px;height:9px;border:0}
.m-title .r2{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.m-acts{display:flex;gap:4px;align-items:center}
.hbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--mut);position:relative;transition:background .14s,color .14s}
.hbtn:hover{background:var(--paper-2);color:var(--ink)}
.hbtn.on{background:var(--violet-soft);color:var(--violet-ink);box-shadow:inset 0 0 0 1px var(--violet-soft-2)}
.hbtn svg{width:18px;height:18px}
.hbtn .mini-cnt{position:absolute;top:3px;right:3px;background:var(--grad);color:#fff;font-size:9.5px;font-weight:800;min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;padding:0 4px}

/* messages */
#mwrap{flex:1;min-height:0;display:flex}
#mcol{flex:1;min-width:0;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--paper-2) 0%,var(--paper) 160px)}
#msgs{flex:1;overflow-y:auto;min-height:0;padding:16px 0 8px}
.day{display:flex;align-items:center;gap:12px;margin:16px 18px 10px}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--line)}
.day span{font-size:11px;font-weight:800;color:var(--mut);background:var(--paper);border:1px solid var(--line);padding:4px 12px;border-radius:999px;box-shadow:0 2px 6px -3px rgba(23,27,56,.15)}
.newdiv{display:flex;align-items:center;gap:10px;margin:10px 18px;color:var(--red);font-size:10.5px;font-weight:800;letter-spacing:.06em}
.newdiv::after{content:"";flex:1;height:1.5px;background:linear-gradient(90deg,var(--red),transparent);border-radius:2px}
.msg{position:relative;display:flex;gap:11px;padding:3px 18px;scroll-margin:76px;border-left:2px solid transparent}
.msg.first{padding-top:10px;margin-top:2px}
.msg:hover{background:var(--hov)}
.msg.pop{animation:mpop .34s cubic-bezier(.18,1.2,.35,1)}
@keyframes mpop{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.msg.flash{animation:flash 1.7s ease-out}
@keyframes flash{0%,55%{background:var(--violet-soft)}100%{background:transparent}}
.msg .gav{width:36px;flex:0 0 auto;padding-top:2px}
.msg .gav .ts-h{display:none;font-size:10px;color:var(--dim);padding-top:4px;text-align:right;font-variant-numeric:tabular-nums}
.msg:not(.first):hover .gav .ts-h{display:block}
.msg .bd{flex:1;min-width:0}
.msg .hd{display:flex;align-items:baseline;gap:8px}
.msg .hd b{font-size:13.5px;letter-spacing:-.01em;font-weight:700}
.msg .hd time{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.msg .tx{font-size:14px;line-height:1.52;word-wrap:break-word;white-space:pre-wrap}
.msg .tx .ed{color:var(--dim);font-size:11px}
.msg.sysm{padding:7px 18px}
.msg.sysm .bd{display:flex;align-items:center;gap:9px;color:var(--mut);font-size:12.5px}
.msg.sysm .bd svg{width:14px;height:14px;color:var(--violet)}
.pinflag{display:flex;align-items:center;gap:6px;color:#B8780A;font-size:11px;font-weight:800;margin-bottom:2px}
.pinflag svg{width:11px;height:11px}
/* file card */
.fcard{display:inline-flex;align-items:center;gap:11px;margin-top:7px;padding:11px 16px 11px 11px;border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:0 3px 10px -6px rgba(23,27,56,.2);transition:border-color .15s,transform .12s,box-shadow .15s;text-align:left}
.fcard:hover{border-color:var(--violet-2);transform:translateY(-1px);box-shadow:0 8px 20px -8px rgba(var(--vrgb),.4)}
.fcard .fic{width:38px;height:38px;border-radius:11px;background:var(--violet-soft);color:var(--violet-ink);display:grid;place-items:center}
.fcard .fic svg{width:17px;height:17px}
.fcard b{display:block;font-size:13px}
.fcard span{font-size:11.5px;color:var(--mut)}
/* reactions */
.rxrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.rx{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);background:var(--paper);font-size:12px;font-weight:700;color:var(--mut);transition:transform .1s,border-color .13s,box-shadow .13s}
.rx:hover{border-color:var(--violet-2);transform:translateY(-1px);box-shadow:0 4px 10px -5px rgba(var(--vrgb),.45)}
.rx.me{background:var(--violet-soft);border-color:var(--violet-2);color:var(--violet-ink)}
.rx .e{font-size:13px}
/* thread link */
.thlink{display:inline-flex;align-items:center;gap:7px;margin-top:7px;padding:5px 10px;border-radius:10px;color:var(--violet-ink);font-size:12.5px;font-weight:700;border:1px solid transparent;transition:background .13s,border-color .13s}
.thlink:hover{background:var(--violet-soft);border-color:var(--violet-soft-2)}
.thlink .avs{display:flex}
.thlink .avs .uav{margin-left:-6px;border:2px solid var(--paper);box-shadow:none}
.thlink .avs .uav:first-child{margin-left:0}
.thlink svg{width:13px;height:13px}
/* hover actions */
.hact{
  position:absolute;top:-16px;right:16px;display:none;gap:1px;padding:3px;border-radius:12px;z-index:5;
  background:var(--glass-2);backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:var(--sh-sm);
}
.msg:hover .hact{display:flex}
.hact button{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;color:var(--mut);transition:background .12s,color .12s,transform .1s}
.hact button:hover{background:var(--violet-soft);color:var(--violet-ink);transform:translateY(-1px)}
.hact button svg{width:15px;height:15px}
/* empty state */
.empty{padding:40px 24px;text-align:center;max-width:460px;margin:7vh auto 0;position:relative}
.empty::before{content:"";position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:220px;height:160px;border-radius:50%;z-index:-1;
  background:radial-gradient(closest-side, rgba(var(--vrgb),.22), transparent)}
.empty .uav{margin:0 auto 16px}
.empty h3{margin:0 0 6px;font-size:18px;letter-spacing:-.02em;font-weight:800}
.empty p{margin:0;color:var(--mut);font-size:13px;line-height:1.6}
/* typing */
#typing{flex:0 0 auto;height:22px;padding:0 22px;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:7px;visibility:hidden}
#typing.on{visibility:visible}
#typing .dots{display:flex;gap:3px}
#typing .dots i{width:4px;height:4px;border-radius:50%;background:var(--violet-2);animation:tp 1s infinite}
#typing .dots i:nth-child(2){animation-delay:.18s}
#typing .dots i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-3px);opacity:1}}
/* composer */
.comp{flex:0 0 auto;padding:0 16px 16px}
.comp-in{display:flex;align-items:flex-end;gap:4px;border:1.5px solid var(--line-2);border-radius:18px;background:var(--paper);padding:7px 8px;
  box-shadow:0 10px 30px -18px rgba(23,27,56,.35);transition:border-color .15s,box-shadow .15s}
.comp-in:focus-within{border-color:var(--violet-2);box-shadow:0 10px 34px -16px rgba(var(--vrgb),.5), 0 0 0 4px rgba(var(--vrgb),.1)}
.cbtn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--mut);flex:0 0 auto;transition:background .13s,color .13s}
.cbtn:hover{background:var(--violet-soft);color:var(--violet-ink)}
.cbtn svg{width:18px;height:18px}
#cinput{flex:1;border:0;outline:none;resize:none;background:none;max-height:140px;padding:8px 6px;font-size:14px;line-height:1.45}
#cinput::placeholder{color:var(--dim)}
.sendb{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--grad);color:#fff;flex:0 0 auto;
  box-shadow:0 8px 18px -6px rgba(var(--vrgb),.75), inset 0 1px 0 rgba(255,255,255,.3);transition:filter .15s,transform .08s,box-shadow .15s}
.sendb:hover{filter:brightness(1.08)}
.sendb:active{transform:scale(.93)}
.sendb:disabled{background:var(--paper-3);color:var(--dim);box-shadow:none;filter:none}
.sendb svg{width:17px;height:17px}
body[data-density="compact"] .msg{padding-top:1px;padding-bottom:1px}
body[data-density="compact"] .msg.first{padding-top:6px}

/* ================= Right panel ================= */
#panel{width:376px;flex:0 0 auto;border-left:1px solid var(--line);background:var(--paper);display:none;flex-direction:column;min-width:0}
#panel.on{display:flex;animation:pslide .22s cubic-bezier(.2,1,.3,1)}
@keyframes pslide{from{transform:translateX(16px);opacity:0}to{transform:none;opacity:1}}
.p-h{flex:0 0 auto;display:flex;align-items:center;gap:10px;height:60px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px)}
.p-h h2{margin:0;font-size:14.5px;letter-spacing:-.01em;flex:1;font-weight:800}
.p-h .sub{font-size:11.5px;color:var(--mut);font-weight:600}
.p-x{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--mut)}
.p-x:hover{background:var(--paper-2);color:var(--ink)}
.p-x svg{width:15px;height:15px}
.p-b{flex:1;overflow-y:auto;min-height:0}
.p-b .msg:hover .hact{display:none}
.th-root{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px;background:linear-gradient(180deg,var(--paper-2),var(--paper))}
.th-cnt{padding:10px 18px 2px;color:var(--mut);font-size:11px;font-weight:800;letter-spacing:.04em}
.p-comp{flex:0 0 auto;padding:10px 12px 12px}
.pinrow{display:flex;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.pinrow:hover{background:var(--hov)}
.pinrow .bd{flex:1;min-width:0}
.pinrow b{font-size:12.5px}
.pinrow time{font-size:11px;color:var(--dim);margin-left:6px}
.pinrow p{margin:3px 0 0;font-size:13px;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pinrow .unpin{color:var(--dim);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto}
.pinrow .unpin:hover{background:var(--paper-3);color:var(--red)}
.pinrow .unpin svg{width:14px;height:14px}
.inf-sec{padding:16px 16px 6px;font-size:11px;font-weight:800;color:var(--dim);letter-spacing:.05em}
.inf-topic{padding:2px 16px 12px;font-size:13.5px;color:var(--ink);border-bottom:1px solid var(--line)}
.mrow{display:flex;align-items:center;gap:11px;padding:9px 14px}
.mrow:hover{background:var(--hov)}
.mrow .pi{flex:1;min-width:0}
.mrow .pi b{display:block;font-size:13.5px;font-weight:700}
.mrow .pi span{font-size:11.5px;color:var(--mut)}
.mrow .dmav .pd{border-color:var(--paper)}
.rolechip{font-size:10px;font-weight:800;padding:3.5px 9px;border-radius:7px;background:var(--grad);color:#fff;letter-spacing:.03em}
.p-note{padding:12px 16px;color:var(--mut);font-size:12px;line-height:1.55}
.p-empty{padding:48px 24px;text-align:center;color:var(--mut);font-size:13px}
.p-empty svg{width:28px;height:28px;margin:0 auto 10px;color:var(--dim)}

/* ================= Search overlay ================= */
#sov{position:fixed;inset:0;z-index:120;display:none;background:rgba(14,16,38,.5);backdrop-filter:blur(6px);padding:9vh 16px 16px}
#sov.on{display:block}
.sbox{max-width:640px;margin:0 auto;background:var(--paper);border-radius:20px;box-shadow:var(--sh-lg);overflow:hidden;display:flex;flex-direction:column;max-height:72vh;animation:srise .2s cubic-bezier(.18,1.15,.4,1)}
@keyframes srise{from{transform:translateY(14px) scale(.985);opacity:0}to{transform:none;opacity:1}}
.srow{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--line)}
.srow svg{width:18px;height:18px;color:var(--violet)}
#sinput{flex:1;border:0;outline:none;font-size:15px;background:none}
.skbd{font-size:10.5px;color:var(--dim);border:1px solid var(--line-2);padding:2px 7px;border-radius:6px;font-weight:800}
.sres{overflow-y:auto;min-height:0}
.sres .grp{padding:12px 18px 4px;font-size:10.5px;font-weight:800;color:var(--dim);letter-spacing:.06em}
.shit{display:flex;gap:10px;width:100%;text-align:left;padding:10px 18px;align-items:flex-start;transition:background .1s}
.shit:hover{background:var(--violet-soft)}
.shit .bd{flex:1;min-width:0}
.shit b{font-size:12.5px}
.shit time{font-size:11px;color:var(--dim);margin-left:6px}
.shit p{margin:2px 0 0;font-size:13px;color:var(--mut);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.shit mark{background:#FFE9A8;border-radius:3px;padding:0 1px}
.s-none{padding:40px;text-align:center;color:var(--mut);font-size:13px;line-height:1.7}

/* ================= Modals ================= */
#mov{position:fixed;inset:0;z-index:120;display:none;background:rgba(14,16,38,.5);backdrop-filter:blur(6px);padding:10vh 16px 16px}
#mov.on{display:block}
.mbox{max-width:470px;margin:0 auto;background:var(--paper);border-radius:20px;box-shadow:var(--sh-lg);overflow:hidden;animation:srise .2s cubic-bezier(.18,1.15,.4,1)}
.mb-h{display:flex;align-items:center;gap:10px;padding:18px 20px 0}
.mb-h h2{margin:0;font-size:17px;letter-spacing:-.02em;flex:1;font-weight:800}
.mb-b{padding:14px 20px 18px;max-height:56vh;overflow-y:auto}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11.5px;font-weight:800;color:var(--mut);margin-bottom:7px;letter-spacing:.03em}
.fld input[type=text]{width:100%;border:1.5px solid var(--line-2);border-radius:12px;padding:11px 13px;font-size:14px;outline:none;background:var(--paper);color:var(--ink);transition:border-color .15s,box-shadow .15s}
.fld input[type=text]:focus{border-color:var(--violet-2);box-shadow:0 0 0 4px rgba(var(--vrgb),.1)}
.togrow{display:flex;align-items:center;gap:12px;padding:11px 2px}
.togrow .tx{flex:1}
.togrow .tx b{display:block;font-size:13.5px;font-weight:700}
.togrow .tx span{font-size:12px;color:var(--mut)}
.tg{width:42px;height:24px;border-radius:999px;background:var(--line-2);position:relative;transition:background .18s;flex:0 0 auto}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:left .18s}
.tg.on{background:var(--green)}
.tg.on::after{left:21px}
.mb-acts{display:flex;justify-content:flex-end;gap:8px;padding:0 20px 20px}
.btn{padding:10px 18px;border-radius:12px;font-weight:800;font-size:13.5px}
.btn.pri{background:var(--grad);color:#fff;box-shadow:0 8px 18px -6px rgba(var(--vrgb),.7)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.pri:disabled{background:var(--paper-3);color:var(--dim);box-shadow:none}
.btn.ghost{color:var(--mut)}
.btn.ghost:hover{background:var(--paper-2);color:var(--ink)}
.chrow{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line)}
.chrow:last-child{border-bottom:0}
.chrow .hashic{width:36px;height:36px;border-radius:11px;background:var(--violet-soft);display:grid;place-items:center;color:var(--violet-ink)}
.chrow .hashic svg{width:15px;height:15px}
.chrow .pi{flex:1;min-width:0}
.chrow .pi b{display:block;font-size:13.5px;font-weight:700}
.chrow .pi span{font-size:11.5px;color:var(--mut)}
.joinb{font-size:12px;font-weight:800;padding:7px 15px;border-radius:999px;border:1.5px solid var(--violet-2);color:var(--violet-ink);transition:background .13s}
.joinb:hover{background:var(--violet-soft)}
.joinb.leave{border-color:var(--line-2);color:var(--mut)}
.urow{display:flex;align-items:center;gap:11px;padding:9px 6px;border-radius:12px;width:100%;text-align:left}
.urow:hover{background:var(--violet-soft)}
.urow .pi{flex:1}
.urow .pi b{display:block;font-size:13.5px;font-weight:700}
.urow .pi span{font-size:11.5px;color:var(--mut)}
.urow .dmav .pd{border-color:var(--paper)}

/* ================= Toasts ================= */
#toasts{position:fixed;top:14px;right:14px;z-index:270;display:flex;flex-direction:column;gap:8px;width:min(366px,calc(100% - 28px))}
.toast{position:relative;display:flex;align-items:center;gap:10px;padding:12px 14px 12px 17px;border-radius:15px;overflow:hidden;
  background:var(--glass-2);backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:var(--sh);font-size:13px;animation:tin .24s cubic-bezier(.18,1.2,.4,1)}
.toast::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3.5px;background:var(--grad)}
@keyframes tin{from{transform:translateX(16px);opacity:0}to{transform:none;opacity:1}}
.toast.out{animation:tout .22s forwards}
@keyframes tout{to{transform:translateX(10px);opacity:0}}
.toast .uav{flex:0 0 auto}
.toast svg.tic{width:17px;height:17px;color:var(--violet);flex:0 0 auto}
.toast .msg{flex:1;min-width:0}
.toast .msg b{font-weight:800}
.toast .msg p{margin:1px 0 0;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast .ta{display:flex;gap:6px}
.toast .ta button{font-size:12px;font-weight:800;padding:7px 12px;border-radius:10px}
.toast .ta .ok{background:var(--grad);color:#fff;box-shadow:0 5px 12px -5px rgba(var(--vrgb),.7)}
.toast .ta .no{color:var(--mut);border:1px solid var(--line-2)}

/* ================= Context menu / emoji ================= */
.cmenu{position:fixed;z-index:260;min-width:196px;background:var(--glass-2);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;padding:5px;box-shadow:var(--sh);animation:srise .13s}
.cmenu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;font-size:13px;font-weight:600;text-align:left}
.cmenu button:hover{background:var(--violet-soft)}
.cmenu button.danger{color:var(--red)}
.cmenu button.danger:hover{background:rgba(229,72,77,.12)}
.cmenu button:disabled{color:var(--dim);cursor:not-allowed}
.cmenu button:disabled:hover{background:none}
.cmenu .sep{height:1px;background:var(--line);margin:4px 8px}
.cmenu .hint{padding:5px 10px 7px;font-size:11px;color:var(--dim);line-height:1.45}
.cmenu button svg{width:15px;height:15px}
.epick{position:fixed;z-index:260;display:flex;gap:2px;padding:6px;background:var(--glass-2);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:999px;box-shadow:var(--sh);animation:srise .13s}
.epick button{width:37px;height:37px;border-radius:50%;font-size:19px;display:grid;place-items:center;transition:transform .1s,background .12s}
.epick button:hover{background:var(--violet-soft);transform:scale(1.18)}

/* ================= CALL ================= */
#callov{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;color:var(--dk-text);background:var(--dk);isolation:isolate;overflow:hidden}
#callov.on{display:flex}
#callov::before,#callov::after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(90px);opacity:.55;pointer-events:none}
#callov::before{width:560px;height:560px;left:-140px;top:-180px;background:radial-gradient(circle,#4A34C8,transparent 70%);animation:aur1 16s ease-in-out infinite alternate}
#callov::after{width:520px;height:520px;right:-160px;bottom:-200px;background:radial-gradient(circle,#7A3BD6,transparent 70%);animation:aur2 19s ease-in-out infinite alternate}
@keyframes aur1{from{transform:translate(0,0)}to{transform:translate(70px,50px)}}
@keyframes aur2{from{transform:translate(0,0)}to{transform:translate(-60px,-60px)}}
.c-top{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px}
.c-top .nm{font-weight:800;font-size:14.5px;letter-spacing:-.01em}
.c-top .st{color:var(--dk-mut);font-size:12px;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.c-top .st .live{width:7px;height:7px;border-radius:50%;background:#2BD576;animation:cpulse 2.2s infinite}
@keyframes cpulse{0%,100%{box-shadow:0 0 0 0 rgba(43,213,118,.4)}60%{box-shadow:0 0 0 6px rgba(43,213,118,0)}}
.c-top .sp{flex:1}
.c-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--dk-mut);transition:background .14s,color .14s}
.c-ic:hover{background:rgba(255,255,255,.08);color:#fff}
.c-ic svg{width:18px;height:18px}
#cstage{flex:1;min-height:0;padding:4px 16px 10px;display:flex;gap:12px;position:relative}
.c-grid{flex:1;display:grid;gap:12px;grid-template-columns:repeat(var(--cols,1),1fr);grid-auto-rows:1fr;min-height:0}
.c-tile{position:relative;border-radius:18px;overflow:hidden;display:grid;place-items:center;min-height:0;container-type:size;
  background:radial-gradient(125% 115% at 28% 16%, hsl(var(--h) 56% 48%) 0%, hsl(var(--h) 60% 30%) 58%, hsl(var(--h) 62% 20%) 100%);
  outline:2px solid transparent;outline-offset:-2px;transition:outline-color .2s,box-shadow .2s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2), 0 20px 50px -22px rgba(0,0,0,.65)}
.c-tile::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.05;background-image:var(--noise)}
.c-tile.speaking{outline-color:rgba(122,243,178,.95);box-shadow:inset 0 1px 0 rgba(255,255,255,.2), 0 0 0 1px rgba(34,197,94,.35), 0 14px 48px -14px rgba(34,197,94,.45)}
.c-tile .av{width:clamp(50px,27cqmin,120px);height:clamp(50px,27cqmin,120px);border-radius:50%;display:grid;place-items:center;
  font-weight:700;font-size:clamp(18px,10cqmin,44px);background:rgba(255,255,255,.17);color:#fff;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.26), 0 10px 30px -10px rgba(0,0,0,.5);text-shadow:0 1px 3px rgba(0,0,0,.25)}
.c-tile.speaking .av{animation:spk 1.6s ease-in-out infinite}
@keyframes spk{0%,100%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.26),0 0 0 0 rgba(143,246,186,.5)}55%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.26),0 0 0 12px rgba(143,246,186,0)}}
.c-tile .nmr{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:7px;max-width:calc(100% - 54px);
  background:rgba(8,10,24,.6);backdrop-filter:blur(10px);padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.c-tile .nmr .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-tile .nmr .yx{color:rgba(255,255,255,.6);font-weight:500}
.c-mic{width:14px;height:14px;color:#FF9AA0;flex:0 0 auto}
.c-eq{display:flex;align-items:flex-end;gap:2px;height:12px;flex:0 0 auto}
.c-eq i{width:3px;border-radius:2px;background:#8FF6BA;animation:eq .9s ease-in-out infinite}
.c-eq i:nth-child(1){height:5px}.c-eq i:nth-child(2){height:11px;animation-delay:.15s}.c-eq i:nth-child(3){height:8px;animation-delay:.3s}
@keyframes eq{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.c-tile:not(.speaking) .c-eq{display:none}
.c-hand{position:absolute;top:9px;left:9px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:rgba(245,158,11,.95);color:#241700;box-shadow:0 6px 14px -4px rgba(245,158,11,.6);animation:handup .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes handup{from{transform:translateY(8px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.c-hand svg{width:15px;height:15px}
.c-dots{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(8,10,24,.55);color:#fff;opacity:0;transition:opacity .15s;backdrop-filter:blur(8px)}
.c-tile:hover .c-dots{opacity:1}
@media (hover:none){.c-dots{opacity:.85}}
.c-dots svg{width:15px;height:15px}
/* presenting */
.c-present{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.c-scr{flex:1;min-height:0;border-radius:18px;position:relative;overflow:hidden;background:#090C1C;border:1px solid var(--dk-line);display:flex;flex-direction:column;box-shadow:0 30px 70px -28px rgba(0,0,0,.8)}
.c-scrtop{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;background:rgba(255,255,255,.035);border-bottom:1px solid var(--dk-line)}
.c-scrtop .who{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--dk-mut)}
.c-scrtop .who b{color:#fff}
.c-scrtop .who svg{width:14px;height:14px;color:var(--violet-2)}
.c-scrbody{flex:1;min-height:0;position:relative}
.fakewin{position:absolute;inset:14px;border-radius:12px;background:#F5F6FA;color:#1b2033;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 64px -22px rgba(0,0,0,.8)}
.fw-bar{display:flex;align-items:center;gap:6px;padding:9px 12px;background:#fff;border-bottom:1px solid #E6E8F0}
.fw-bar i{width:10px;height:10px;border-radius:50%}
.fw-bar i:nth-child(1){background:#FF5F57}.fw-bar i:nth-child(2){background:#FEBC2E}.fw-bar i:nth-child(3){background:#28C840}
.fw-bar span{margin-left:8px;font-size:11px;color:#8a90a8;font-weight:600}
.fw-main{flex:1;display:flex;min-height:0}
.fw-side{width:80px;background:#1B1F3A;flex:0 0 auto;padding:10px 8px;display:flex;flex-direction:column;gap:6px}
.fw-side i{height:9px;border-radius:5px;background:rgba(255,255,255,.14)}
.fw-side i:first-child{background:#6C4DE6}
.fw-cont{flex:1;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.fw-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.fw-kpi{background:#fff;border:1px solid #E6E8F0;border-radius:10px;padding:9px}
.fw-kpi b{display:block;font-size:16px;letter-spacing:-.02em}
.fw-kpi span{font-size:10px;color:#8a90a8;font-weight:600}
.fw-chart{flex:0 0 clamp(90px,30%,190px);background:#fff;border:1px solid #E6E8F0;border-radius:10px;padding:11px;display:flex;align-items:flex-end;gap:6px;min-height:56px}
.fw-chart i{flex:1;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#8F76F5,#6C4DE6);animation:bar 3s ease-in-out infinite;transform-origin:bottom}
@keyframes bar{0%,100%{transform:scaleY(.85)}50%{transform:scaleY(1)}}
.fw-rows{flex:1;background:#fff;border:1px solid #E6E8F0;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:9px;min-height:0;overflow:hidden}
.fw-rows i{height:10px;border-radius:5px;background:#EEF0F7;flex:0 0 auto}
.fw-rows i:nth-child(3n+1){width:74%}
.fw-rows i:nth-child(3n+2){width:90%}
.fw-rows i:nth-child(3n){width:58%}
.c-scrbody video,.selfpv .ph video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#05070F}
.demo-bdg{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:var(--violet-3);background:rgba(var(--vrgb),.22);border:1px solid rgba(143,118,245,.4);padding:4px 10px;border-radius:999px;letter-spacing:.05em}
.pvmock{position:absolute;inset:10px;border-radius:9px;background:#F5F6FA;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 20px -10px rgba(0,0,0,.6)}
.pvmock .bar{display:flex;gap:5px;padding:7px 9px;background:#fff;border-bottom:1px solid #E6E8F0;align-items:center;flex:0 0 auto}
.pvmock .bar i{width:8px;height:8px;border-radius:50%}
.pvmock .bar i:nth-child(1){background:#FF5F57}.pvmock .bar i:nth-child(2){background:#FEBC2E}.pvmock .bar i:nth-child(3){background:#28C840}
.pvmock .bar span{margin-left:5px;font-size:9px;color:#8a90a8;font-weight:700}
.pvmock .bd2{flex:1;display:flex;align-items:flex-end;gap:4px;padding:8px}
.pvmock .bd2 i{flex:1;border-radius:3px 3px 0 0;background:linear-gradient(180deg,#8F76F5,#6C4DE6)}
.c-strip{display:flex;gap:10px;height:104px;flex:0 0 auto;overflow-x:auto}
.c-strip .c-tile{flex:0 0 148px;border-radius:13px}
.c-strip .c-tile .av{width:42px;height:42px;font-size:15px}
.c-strip .c-tile .nmr{left:7px;bottom:7px;padding:3px 8px;font-size:10.5px}
.selfpv{position:absolute;right:14px;bottom:14px;width:212px;border-radius:15px;overflow:hidden;border:1px solid rgba(143,118,245,.55);background:#090C1C;box-shadow:0 18px 48px -14px rgba(0,0,0,.8);z-index:5;animation:srise .2s}
.selfpv .ph{height:106px;position:relative;background:#0D1126}
.selfpv .cap{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:var(--dk-glass);font-size:11.5px;font-weight:700}
.selfpv .cap span{display:flex;align-items:center;gap:6px;color:var(--violet-3)}
.selfpv .cap svg{width:13px;height:13px}
.selfpv .cap button{color:#FF9AA0;font-weight:800;font-size:11.5px;padding:4px 9px;border-radius:7px}
.selfpv .cap button:hover{background:rgba(229,72,77,.15)}
/* dock */
.c-dock{flex:0 0 auto;display:flex;justify-content:center;padding:0 12px 16px;position:relative;z-index:20}
.c-dockin{display:flex;align-items:center;gap:8px;padding:10px;border-radius:24px;background:var(--dk-glass);border:1px solid var(--dk-line);backdrop-filter:blur(20px);box-shadow:0 24px 70px -20px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.08)}
.cc{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:rgba(255,255,255,.08);color:#fff;position:relative;transition:background .15s,transform .08s;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.cc:hover{background:rgba(255,255,255,.15)}
.cc:active{transform:scale(.93)}
.cc svg{width:21px;height:21px}
.cc.off{background:linear-gradient(135deg,#F0565C,#D63238);box-shadow:0 8px 20px -6px rgba(229,72,77,.6), inset 0 1px 0 rgba(255,255,255,.25)}
.cc.lit{background:var(--grad);box-shadow:0 8px 20px -6px rgba(var(--vrgb),.7), inset 0 1px 0 rgba(255,255,255,.25)}
.cc.amb{background:linear-gradient(135deg,#FFB038,#E8930C);color:#241700;box-shadow:0 8px 20px -6px rgba(245,158,11,.6), inset 0 1px 0 rgba(255,255,255,.35)}
.cc .lbl{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:#080A18;border:1px solid var(--dk-line);color:#fff;font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.cc:hover .lbl{opacity:1}
.c-leave{width:70px;height:52px;border-radius:17px;background:linear-gradient(135deg,#F0565C,#D63238);color:#fff;display:grid;place-items:center;margin-left:4px;transition:filter .15s,transform .08s;box-shadow:0 10px 24px -8px rgba(229,72,77,.75), inset 0 1px 0 rgba(255,255,255,.25)}
.c-leave:hover{filter:brightness(1.1)}
.c-leave:active{transform:scale(.95)}
.c-leave svg{width:22px;height:22px}
.c-sep{width:1px;height:28px;background:var(--dk-line)}
/* call pills */
.c-pill{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--dk-glass);border:1px solid var(--dk-line);font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;backdrop-filter:blur(10px);color:#E6E8FA}
.c-pill svg{width:13px;height:13px}
.c-pill.rec{color:#FF9AA0;border-color:rgba(229,72,77,.45)}
.c-pill.rec i{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse-r 1.6s infinite}
@keyframes pulse-r{0%,100%{opacity:1}50%{opacity:.3}}
.c-pill.bo{color:var(--violet-3);border-color:rgba(143,118,245,.45)}
/* breakout banner */
.bo-banner{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:rgba(var(--vrgb),.16);border:1px solid rgba(143,118,245,.4);color:#E6E0FF;font-size:12.5px;backdrop-filter:blur(10px)}
.bo-banner svg{width:15px;height:15px;color:var(--violet-3);flex:0 0 auto}
.bo-banner span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bo-banner button{font-size:12px;font-weight:800;color:#fff;background:var(--grad);padding:7px 13px;border-radius:999px;box-shadow:0 6px 14px -5px rgba(var(--vrgb),.7);flex:0 0 auto}
/* whiteboard */
.wb{flex:1;min-height:0;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;background:#FBFBFF;border:1px solid var(--dk-line);box-shadow:0 30px 70px -28px rgba(0,0,0,.8)}
.wb-top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fff;border-bottom:1px solid #E8EAF3;flex-wrap:wrap}
.wb-grp{display:flex;gap:3px;align-items:center;padding:3px;border:1px solid #E8EAF3;border-radius:11px;background:#FBFBFE}
.wb-sw{width:26px;height:26px;border-radius:50%;position:relative}
.wb-sw::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--c)}
.wb-sw.sel{box-shadow:inset 0 0 0 2px var(--violet-2)}
.wb-sz{width:28px;height:26px;border-radius:9px;display:grid;place-items:center}
.wb-sz i{border-radius:50%;background:#1B1F3A;display:block}
.wb-sz.sel{background:var(--violet-soft);box-shadow:inset 0 0 0 1.5px var(--violet-2)}
.wb-tl{width:30px;height:26px;border-radius:9px;display:grid;place-items:center;color:#696F8E}
.wb-tl svg{width:15px;height:15px}
.wb-tl:hover{background:#F1F2F9;color:#171A2E}
.wb-tl.sel{background:var(--violet-soft);color:var(--violet-ink);box-shadow:inset 0 0 0 1.5px var(--violet-2)}
.wb-close{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:#696F8E;padding:7px 12px;border-radius:999px;border:1px solid #E0E2EF}
.wb-close:hover{color:#171A2E;border-color:var(--violet-3);background:var(--violet-soft)}
.wb-close svg{width:13px;height:13px}
.wb-wrap{flex:1;min-height:0;position:relative;cursor:crosshair;touch-action:none;
  background-image:radial-gradient(#D9DCEC 1px,transparent 1.5px);background-size:22px 22px;background-color:#FBFBFF}
.wb-wrap canvas{position:absolute;inset:0}
.wb-cursor{position:absolute;transform:translate(10px,10px);background:#E0507A;color:#fff;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px 999px 999px 3px;pointer-events:none;box-shadow:0 6px 14px -4px rgba(224,80,122,.7);z-index:3}
/* ---- themes ---- */
body[data-accent="ocean"]{--violet:#0B84F3;--violet-2:#3FA3FF;--violet-3:#9ED1FF;--violet-ink:#085FBD;--vrgb:11,132,243;--violet-soft:#EAF4FF;--violet-soft-2:#D7EBFF;--grad:linear-gradient(120deg,#3FA3FF 0%,#0B84F3 55%,#0A6AD1 100%);--side:#0F1D38;--side-2:#0A152B}
body[data-accent="sunset"]{--violet:#FF4365;--violet-2:#FF7A45;--violet-3:#FFB3C0;--violet-ink:#C2184B;--vrgb:255,67,101;--violet-soft:#FFEFF1;--violet-soft-2:#FFDFE4;--grad:linear-gradient(120deg,#FF7A45 0%,#FF4365 55%,#E12A54 100%);--side:#2A0F22;--side-2:#1B0917}
body[data-accent="emerald"]{--violet:#0FB573;--violet-2:#35E09A;--violet-3:#9FF0CC;--violet-ink:#077A4D;--vrgb:15,181,115;--violet-soft:#E8FBF2;--violet-soft-2:#D1F5E6;--grad:linear-gradient(120deg,#35E09A 0%,#0FB573 55%,#0B9A61 100%);--side:#0B241E;--side-2:#071914}
body[data-accent="magenta"]{--violet:#E31FA9;--violet-2:#FF5BCB;--violet-3:#FFADE4;--violet-ink:#AC0F7E;--vrgb:227,31,169;--violet-soft:#FDEDF8;--violet-soft-2:#FBDCF1;--grad:linear-gradient(120deg,#FF5BCB 0%,#E31FA9 55%,#C2138F 100%);--side:#2A0C24;--side-2:#1A0716}
body[data-mode="dark"]{
  --paper:#161A33;--paper-2:#11142A;--paper-3:#0D1022;
  --ink:#EEF0FB;--mut:#9FA6CB;--dim:#6E759B;
  --line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.16);
  --hov:rgba(255,255,255,.05);--glass:rgba(15,18,39,.85);--glass-2:rgba(21,25,50,.95);
  --violet-soft:rgba(var(--vrgb),.18);--violet-soft-2:rgba(var(--vrgb),.32);
  --violet-ink:var(--violet-3);
  --sh:0 12px 38px -14px rgba(0,0,0,.55);--sh-sm:0 5px 18px -7px rgba(0,0,0,.5);--sh-lg:0 32px 90px -24px rgba(0,0,0,.72);
}
body[data-mode="dark"] .shit mark{background:rgba(255,196,77,.26);color:#FFD88A}
body[data-mode="dark"] .pinflag{color:#FFC24D}
body[data-mode="dark"] *::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border:3px solid transparent;background-clip:content-box}
/* appearance controls */
.ap-h{font-size:10.5px;font-weight:900;letter-spacing:.1em;color:var(--dim);margin:14px 2px 4px}
.seg{display:flex;background:var(--paper-3);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:8px;font-weight:800;font-size:12px;color:var(--mut)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:var(--sh-sm)}
.swr{display:flex;gap:11px;padding:6px 2px 2px}
.swb{width:33px;height:33px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);transition:transform .12s}
.swb:hover{transform:scale(1.1)}
.swb.on{box-shadow:0 0 0 2px var(--paper),0 0 0 4.5px var(--violet)}
/* avatar photos */
.uav{position:relative;overflow:hidden}
.uav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.c-tile .av{position:relative;overflow:hidden}
.c-tile .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.ring-av .c{overflow:hidden}
.ring-av .c img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.ph-prev{width:46px;height:46px;border-radius:14px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;position:relative;overflow:hidden;background:var(--grad)}
.ph-prev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.prof-card{display:flex;flex-direction:column;align-items:center;gap:7px;padding:22px 16px 16px;border-bottom:1px solid var(--line);text-align:center}
.prof-card .uav{width:78px;height:78px;border-radius:24px;font-size:27px}
.prof-card b{font-size:15px;font-weight:800;letter-spacing:-.01em}
.prof-card span.st2{font-size:12px;color:var(--mut)}
.bg-addp{display:flex;align-items:center;gap:6px;width:100%;justify-content:center;font-size:11.5px;font-weight:800;color:var(--violet-3);padding:7px 8px;border-radius:10px;margin-top:4px;border:1px dashed rgba(143,118,245,.45)}
.bg-addp:hover{background:rgba(var(--vrgb),.16)}
.bg-addp svg{width:12px;height:12px}
/* breakout sidebar */
#bopanel{position:absolute;top:70px;right:16px;bottom:96px;width:340px;z-index:60;display:none;flex-direction:column;background:var(--dk-glass);border:1px solid var(--dk-line);border-radius:20px;backdrop-filter:blur(20px);box-shadow:0 30px 80px -24px rgba(0,0,0,.8);overflow:hidden;animation:bslide .22s cubic-bezier(.2,1,.3,1)}
#bopanel.on{display:flex}
@keyframes bslide{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
.bo-h{display:flex;align-items:center;gap:10px;padding:14px 14px 6px;flex:0 0 auto}
.bo-h h2{margin:0;flex:1;font-size:15px;font-weight:800;letter-spacing:-.01em;color:#fff}
.bo-x{color:var(--dk-mut)}
.bo-x:hover{background:rgba(255,255,255,.08);color:#fff}
.bo-note{font-size:11px;color:var(--dk-mut);padding:0 14px 8px;line-height:1.55;margin:0;flex:0 0 auto}
.bo-b{flex:1;overflow-y:auto;min-height:0;padding:2px 12px 10px}
.bo-sec{font-size:10.5px;font-weight:800;color:var(--dk-mut);letter-spacing:.06em;margin:10px 4px 7px;display:flex;align-items:center;gap:7px}
.bo-sec .lv{width:7px;height:7px;border-radius:50%;background:#2BD576;box-shadow:0 0 7px rgba(43,213,118,.9)}
.bg-card{border:1px solid var(--dk-line);border-radius:14px;background:rgba(255,255,255,.045);padding:9px;margin-bottom:9px}
.bg-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;padding:0 2px}
.bg-top b{flex:1;font-size:12.5px;color:#fff;font-weight:800}
.bg-top span{font-size:11px;color:var(--dk-mut)}
.bg-del{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--dk-mut)}
.bg-del:hover{background:rgba(229,72,77,.18);color:#FF9AA0}
.bg-del svg{width:12px;height:12px}
.bo-chip{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 7px;border-radius:9px;font-size:12.5px;font-weight:600;color:#fff}
.bo-chip:not(:disabled):hover{background:rgba(255,255,255,.09)}
.bo-chip:disabled{color:var(--dk-mut);cursor:default}
.bo-chip .mv{margin-left:auto;color:var(--dk-mut)}
.bo-chip .mv svg{width:12px;height:12px}
.bo-empty{font-size:11.5px;color:var(--dk-mut);padding:1px 7px 4px}
.bo-add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px;border-radius:14px;border:1.5px dashed rgba(143,118,245,.5);color:var(--violet-3);font-size:12.5px;font-weight:800;margin:2px 0 9px}
.bo-add:hover{background:rgba(var(--vrgb),.14)}
.bo-add svg{width:14px;height:14px}
.bo-f{flex:0 0 auto;padding:12px;display:flex;gap:8px;border-top:1px solid var(--dk-line)}
.bo-f .go{flex:1;background:var(--grad);color:#fff;font-weight:800;padding:11px;border-radius:12px;box-shadow:0 8px 20px -6px rgba(var(--vrgb),.7)}
.bo-f .go:disabled{background:rgba(255,255,255,.08);box-shadow:none;color:var(--dk-mut);cursor:not-allowed}
.bo-f .ghostb{color:var(--dk-mut);font-weight:800;padding:11px 14px;border-radius:12px}
.bo-f .ghostb:hover{color:#fff;background:rgba(255,255,255,.07)}
/* ringing tile */
.ringov{position:absolute;inset:0;background:rgba(8,10,24,.55);backdrop-filter:blur(2px);display:grid;place-items:center}
.ringov .in{text-align:center}
.ringov .ph{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;margin:0 auto 8px;color:#fff;animation:bnc 1.2s ease-in-out infinite}
.ringov .ph svg{width:16px;height:16px}
.ringov p{margin:0;font-size:12px;font-weight:700;color:#E6E8FA}
/* incoming call box */
#incbox{position:fixed;inset:0;z-index:300;display:none;place-items:center;background:rgba(7,9,22,.55);backdrop-filter:blur(8px);padding:16px}
#incbox.on{display:grid}
.inc-card{width:min(400px,100%);background:var(--dk-glass);border:1px solid var(--dk-line);border-radius:24px;backdrop-filter:blur(22px);box-shadow:0 36px 100px -26px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.1);padding:26px 20px 20px;text-align:center;color:var(--dk-text);animation:srise .22s cubic-bezier(.18,1.15,.4,1)}
.inc-card .ring-av{width:96px;height:96px;margin:0 auto 18px}
.inc-card .ring-av .c{font-size:33px}
.inc-card h2{margin:0 0 4px;font-size:21px;letter-spacing:-.02em;font-weight:800}
.inc-sub{margin:0 0 24px;color:var(--dk-mut);font-size:12.5px;font-variant-numeric:tabular-nums}
.inc-acts{gap:30px;justify-content:center;display:flex}
.inc-acts .rbtn{width:56px;height:56px}
.inc-acts .rbtn svg{width:23px;height:23px}
.rbtn.msg{background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.rbtn.msg:hover{background:rgba(255,255,255,.2)}
.inc-replies{display:none;margin-top:20px;gap:7px;flex-direction:column;text-align:left}
.inc-replies.on{display:flex;animation:srise .18s}
.inc-q{width:100%;text-align:left;padding:10px 13px;border-radius:12px;border:1px solid var(--dk-line);background:rgba(255,255,255,.05);color:#E6E8FA;font-size:12.5px;font-weight:600}
.inc-q:hover{background:rgba(var(--vrgb),.2);border-color:rgba(143,118,245,.5)}
.inc-type{display:flex;gap:6px;margin-top:2px}
.inc-type input{flex:1;border:1px solid var(--dk-line);border-radius:12px;background:rgba(255,255,255,.06);color:#fff;padding:10px 12px;font-size:13px;outline:none}
.inc-type input:focus{border-color:var(--violet-2)}
.inc-type input::placeholder{color:var(--dk-mut)}
.inc-type button{width:42px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px -5px rgba(var(--vrgb),.7)}
.inc-type button svg{width:16px;height:16px}
@media (max-width:760px){.c-dockin{max-width:100%;overflow-x:auto}.wb-top{gap:5px}#bopanel{top:auto;left:10px;right:10px;bottom:10px;max-height:62%;width:auto}}
/* call reactions */
#crpick{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);display:none;gap:3px;padding:7px;background:var(--dk-glass);border:1px solid var(--dk-line);border-radius:999px;backdrop-filter:blur(18px);z-index:30;animation:srise .15s;box-shadow:0 18px 50px -16px rgba(0,0,0,.7)}
#crpick.on{display:flex}
#crpick button{width:41px;height:41px;border-radius:50%;font-size:20px;display:grid;place-items:center;transition:transform .1s,background .12s}
#crpick button:hover{background:rgba(255,255,255,.12);transform:scale(1.16)}
#crlayer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:25}
.remoji{position:absolute;bottom:96px;font-size:29px;animation:rfloat 2.5s ease-out forwards}
.remoji small{display:block;font-size:10px;font-weight:800;color:#fff;background:rgba(8,10,24,.7);padding:2px 8px;border-radius:999px;margin-top:3px;text-align:center}
@keyframes rfloat{0%{transform:translateY(0) scale(.6);opacity:0}10%{opacity:1;transform:translateY(-28px) scale(1.08)}100%{transform:translateY(-52vh) translateX(var(--dx,20px));opacity:0}}
/* ring screens */
.c-ring{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(9,11,26,.6);backdrop-filter:blur(8px);padding:20px}
.c-ring.on{display:flex}
.ring-glow{position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(90px);opacity:.5;background:radial-gradient(circle,hsl(var(--h) 65% 45%),transparent 70%);pointer-events:none}
.ring-av{position:relative;width:124px;height:124px;margin-bottom:26px}
.ring-av .c{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-size:42px;font-weight:700;color:#fff;z-index:2;
  background:radial-gradient(130% 130% at 30% 20%, hsl(var(--h) 56% 50%), hsl(var(--h) 60% 28%));box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 20px 50px -14px hsl(var(--h) 60% 30% / .9)}
.ring-av .w{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(143,118,245,.55);animation:wave 2s ease-out infinite}
.ring-av .w:nth-child(2){animation-delay:.65s}
@keyframes wave{from{transform:scale(1);opacity:.9}to{transform:scale(1.75);opacity:0}}
.c-ring h2{margin:0 0 5px;font-size:26px;letter-spacing:-.025em;font-weight:800}
.c-ring p{margin:0 0 36px;color:var(--dk-mut);font-variant-numeric:tabular-nums}
.ring-acts{display:flex;gap:48px}
.ring-act{display:flex;flex-direction:column;gap:10px;align-items:center;font-size:12.5px;color:var(--dk-mut);font-weight:700}
.rbtn{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:transform .1s,filter .15s;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.rbtn:hover{filter:brightness(1.12)}
.rbtn:active{transform:scale(.94)}
.rbtn svg{width:26px;height:26px}
.rbtn.yes{background:linear-gradient(135deg,#2ED47A,#179A4E);animation:bnc 1.4s ease-in-out infinite;box-shadow:0 14px 34px -10px rgba(34,197,94,.7), inset 0 1px 0 rgba(255,255,255,.35)}
@keyframes bnc{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.rbtn.no{background:linear-gradient(135deg,#F0565C,#D63238);box-shadow:0 14px 34px -10px rgba(229,72,77,.7), inset 0 1px 0 rgba(255,255,255,.3)}
/* mini dock */
#mini{position:fixed;right:16px;bottom:16px;z-index:150;display:none;align-items:center;gap:10px;padding:10px 12px;border-radius:19px;color:#fff;
  background:var(--dk-glass);backdrop-filter:blur(18px);border:1px solid var(--dk-line);box-shadow:0 24px 64px -18px rgba(12,15,34,.75), inset 0 1px 0 rgba(255,255,255,.1);animation:srise .2s}

#mini .mi-i{min-width:0}
#mini .mi-i b{display:block;font-size:12.5px;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;font-weight:800}
#mini .mi-i span{font-size:11px;color:var(--dk-mut);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}

#mini button svg{width:16px;height:16px}

#mini button.hang:hover{filter:brightness(1.1)}

const fmtT=ts=>{const d=new Date(ts);return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false})};
const dayLbl=ts=>{const d=new Date(ts),t=new Date();const one=86400e3;const dd=new Date(d.getFullYear(),d.getMonth(),d.getDate()),tt=new Date(t.getFullYear(),t.getMonth(),t.getDate());const diff=(tt-dd)/one;return diff<1?'Today':diff<2?'Yesterday':d.toLocaleDateString([], {weekday:'long', day:'numeric', month:'short'})};

/* ============ Audio ============ */
let AC=null; const ac=()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}};
function tone(f,t0,d,v=.045,ty='sine'){const a=ac();if(!a||!S.sounds)return;try{const o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,a.currentTime+t0);g.gain.exponentialRampToValueAtTime(v,a.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t0+d);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.05)}catch(e){}}
const ding=()=>{tone(740,0,.14,.04);tone(988,.1,.2,.035)};
const pop=()=>tone(520,0,.08,.03,'triangle');
const chime=up=>{if(up){tone(520,0,.12,.04);tone(780,.1,.16,.04)}else{tone(780,0,.12,.035);tone(520,.1,.18,.035)}};
let ringT=null; function ringStart(inc,soft){ringStop();const b=()=>{if(soft){tone(660,0,.12,.02);tone(880,.16,.12,.02)}else if(inc){tone(880,0,.28,.04);tone(660,.32,.28,.04)}else tone(425,0,.9,.028)};b();ringT=setInterval(b,soft?3400:(inc?2000:3000))}
function ringStop(){if(ringT){clearInterval(ringT);ringT=null}}

/* ============ Messages ============ */
function msgHTML(m,prev,inPanel){
  const u=U[m.uid];
  if(m.sys) return `<div class="msg sysm" id="row-${m.id}"><div class="gav"></div><div class="bd">${I.phone}<span>${esc(m.t)}</span></div></div>`;
  const grouped=prev&&!prev.sys&&prev.uid===m.uid&&(m.ts-prev.ts)<5*MIN&&!m.pin;
  const mine=m.uid==='you';
  const acts=inPanel?'':`
    <span class="hact">
      <button data-a="rx" title="React">${I.smile}</button>
      <button data-a="th" title="Reply in thread">${I.reply}</button>
      <button data-a="pin" title="${m.pin?'Unpin':'Pin'}">${I.pin}</button>
      ${mine?`<button data-a="more" title="More">${I.dots}</button>`:''}
    </span>`;
  const rx=Object.keys(m.rx).length?`<div class="rxrow">${Object.entries(m.rx).map(([e,ids])=>`<button class="rx ${ids.includes('you')?'me':''}" data-rx="${e}"><span class="e">${e}</span>${ids.length}</button>`).join('')}</div>`:'';
  const th=(!inPanel&&m.th.length)?`<button class="thlink" data-a="th"><span class="avs">${[...new Set(m.th.map(r=>r.uid))].slice(0,3).map(id=>av(U[id],'sm')).join('')}</span>${m.th.length} ${m.th.length===1?'reply':'replies'} ${I.reply}</button>`:'';
  const file=m.file?`<button class="fcard"><span class="fic">${I.file}</span><span><b>${esc(m.file.n)}</b><span>${esc(m.file.s)}</span></span></button>`:'';
  const callc=m.callInvite?`<button class="fcard" data-jc="1"><span class="fic">${I.phone}</span><span><b>Join my call</b><span>Voice call · tap to join</span></span></button>`:'';
  const pinf=m.pin&&!inPanel?`<div class="pinflag">${I.pin}Pinned</div>`:'';
  return `<div class="msg ${grouped?'':'first'}" id="row-${m.id}" data-mid="${m.id}">
    ${acts}
    <div class="gav">${grouped?`<span class="ts-h">${fmtT(m.ts)}</span>`:av(u)}</div>
    <div class="bd">
      ${pinf}
      ${grouped?'':`<div class="hd"><b>${esc(u.n)}</b><time>${fmtT(m.ts)}</time></div>`}
      <div class="tx">${esc(m.t)}${m.ed?' <span class="ed">(edited)</span>':''}</div>
      ${file}${callc}${rx}${th}
    </div>
  </div>`;
}
function renderMsgs(keepScroll){
  const c=conv(); const box=$('msgs');
  const nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<140;
  if(!c.msgs.length){
    let inner='';
    if(c.type==='dm'&&!c.group){
      const o=U[c.members.find(m=>m!=='you')];
      inner=`<div class="empty">${av(o,'lg')}<h3>${esc(o.n)}</h3><p>This is the very start of your conversation with ${esc(o.n.split(' ')[0])}. Say hello, send a file, or start a call from the phone icon above.</p></div>`;
    } else {
      inner=`<div class="empty"><span class="uav lg" style="--h:252">${c.private?'🔒':'#'}</span><h3>#${esc(c.name)}</h3><p>You created this channel just now. Post the first message to get it going.</p></div>`;
    }
    box.innerHTML=inner;
  } else {
    let h='',prev=null,lastDay='';
    const seen=S.lastSeen[c.id]; let newShown=false;
    c.msgs.forEach(m=>{
      const dl=dayLbl(m.ts);
      if(dl!==lastDay){h+=`<div class="day"><span>${dl}</span></div>`;lastDay=dl;prev=null}
      if(!newShown&&m.ts>seen&&m.uid!=='you'){h+=`<div class="newdiv">NEW</div>`;newShown=true;prev=null}
      h+=msgHTML(m,prev,false); prev=m;
    });
    box.innerHTML=h;
    bindMsgEvents(box);
  }
  if(!keepScroll||nearBottom) box.scrollTop=box.scrollHeight;
  $('cinput').placeholder = c.type==='ch'?`Message #${c.name}`:`Message ${c.name}`;
}
function animLast(){
  const rows=$('msgs').querySelectorAll('.msg');

function bindMsgEvents(root){
  root.querySelectorAll('.hact [data-a], .thlink').forEach(b=>{
    b.onclick=(e)=>{e.stopPropagation();
      const row=b.closest('.msg'), id=row.dataset.mid, a=b.dataset.a;
      if(a==='rx') openEmojiPicker(b,id);
      if(a==='th') openThread(id);
      if(a==='pin') togglePin(id);
      if(a==='more') openMsgMenu(b,id);
    };
  });
  root.querySelectorAll('[data-rx]').forEach(b=>{
    b.onclick=(e)=>{e.stopPropagation();toggleRx(b.closest('.msg').dataset.mid,b.dataset.rx)};
  });
}

/* reactions */
let floatEl=null;
function closeFloat(){if(floatEl){floatEl.remove();floatEl=null}}
document.addEventListener('click',()=>closeFloat());
function openEmojiPicker(anchor,msgId,intoInput){
  closeFloat();
  const el=document.createElement('div');el.className='epick';
  el.innerHTML=EMO.map(e=>`<button>${e}</button>`).join('');
  document.body.appendChild(el);
  const r=anchor.getBoundingClientRect();
  let x=Math.min(r.left,innerWidth-el.offsetWidth-10), y=r.top-el.offsetHeight-8;
  if(y<8)y=r.bottom+8;
  el.style.left=Math.max(8,x)+'px';el.style.top=y+'px';
  el.querySelectorAll('button').forEach(b=>b.onclick=(ev)=>{ev.stopPropagation();closeFloat();
    if(intoInput){const i=$('cinput');i.value+=b.textContent;i.dispatchEvent(new Event('input'));i.focus()}
    else toggleRx(msgId,b.textContent);
  });
  el.onclick=e=>e.stopPropagation();
  floatEl=el;
}
function toggleRx(msgId,e){
  const m=conv().msgs.find(x=>x.id===msgId);if(!m)return;
  m.rx[e]=m.rx[e]||[];
  const i=m.rx[e].indexOf('you');
  if(i>=0){m.rx[e].splice(i,1);if(!m.rx[e].length)delete m.rx[e]}else m.rx[e].push('you');
  renderMsgs(true); if(S.panel==='thread')renderPanel();
}
function togglePin(msgId){
  const m=conv().msgs.find(x=>x.id===msgId);if(!m)return;
  m.pin=!m.pin; renderMsgs(true);renderHead();
  toastIc(m.pin?'pin':'x',m.pin?'Pinned to this conversation':'Unpinned');
  if(S.panel==='pins')renderPanel();
}
function openMsgMenu(anchor,msgId){
  closeFloat();
  const m=conv().msgs.find(x=>x.id===msgId);if(!m)return;
  const el=document.createElement('div');el.className='cmenu';
  el.innerHTML=`<button data-a="edit">${I.edit}<span>Edit message</span></button>
  <button class="danger" data-a="del">${I.trash}<span>Delete message</span></button>`;
  document.body.appendChild(el);
  const r=anchor.getBoundingClientRect();
  el.style.left=Math.max(8,Math.min(r.left,innerWidth-el.offsetWidth-10))+'px';
  el.style.top=(r.bottom+6)+'px';
  el.onclick=e=>e.stopPropagation();
  el.querySelector('[data-a=del]').onclick=()=>{closeFloat();const c=conv();c.msgs=c.msgs.filter(x=>x.id!==msgId);renderMsgs(true);renderHead()};
  el.querySelector('[data-a=edit]').onclick=()=>{closeFloat();startEdit(msgId)};
  floatEl=el;
}
function startEdit(msgId){
  const m=conv().msgs.find(x=>x.id===msgId);if(!m)return;
  const row=$('row-'+msgId);if(!row)return;
  const tx=row.querySelector('.tx');
  tx.innerHTML=`<div class="comp-in" style="margin-top:2px;box-shadow:none"><textarea rows="1" style="flex:1;border:0;outline:none;resize:none;background:none;padding:8px 6px">${esc(m.t)}</textarea><button class="btn ghost" data-e="x">Cancel</button><button class="btn pri" data-e="ok">Save</button></div>`;
  const ta=tx.querySelector('textarea');ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
  tx.querySelector('[data-e=x]').onclick=()=>renderMsgs(true);
  tx.querySelector('[data-e=ok]').onclick=()=>{const v=ta.value.trim();if(v){m.t=v;m.ed=true}renderMsgs(true)};
  ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();tx.querySelector('[data-e=ok]').click()} if(e.key==='Escape')renderMsgs(true)};
}

  $('panel').classList.toggle('on',!!S.panel);
  renderHead(); renderPanel();
}
function openThread(msgId){S.threadId=msgId;S.panel='thread';$('panel').classList.add('on');renderHead();renderPanel();later(()=>$('tinput')&&$('tinput').focus(),60)}
function renderPanel(){
  const pc=$('pComp'); pc.style.display='none';
  if(!S.panel)return;
  const c=conv();
  if(S.panel==='thread'){
    const m=c.msgs.find(x=>x.id===S.threadId);

    $('pTitle').textContent='Thread';$('pSub').textContent=c.type==='ch'?('#'+c.name):c.name;
    let h=`<div class="th-root">${msgHTML(m,null,true)}</div>`;
    if(m.th.length)h+=`<div class="th-cnt">${m.th.length} ${m.th.length===1?'REPLY':'REPLIES'}</div>`;
    let prev=null;
    m.th.forEach(r=>{h+=msgHTML({id:'t'+Math.random(),uid:r.uid,t:r.t,ts:r.ts,rx:{},th:[],pin:false,ed:false,file:null},prev,true);prev=r});

    $('pBody').scrollTop=$('pBody').scrollHeight;
  }
  if(S.panel==='pins'){
    $('pTitle').textContent='Pinned';$('pSub').textContent=c.type==='ch'?('#'+c.name):c.name;

    $('pBody').innerHTML=pins.length?pins.map(m=>`
      <div class="pinrow" data-jump="${m.id}">
        ${av(U[m.uid],'md')}
        <div class="bd"><b>${esc(U[m.uid].n)}</b><time>${fmtT(m.ts)}</time><p>${esc(m.t)}</p></div>
        <button class="unpin" data-unpin="${m.id}" title="Unpin">${I.x}</button>
      </div>`).join('')
      :`<div class="p-empty">${I.pin}Nothing pinned yet.<br>Hover a message and hit the pin.</div>`;
    $('pBody').querySelectorAll('[data-jump]').forEach(r=>r.onclick=e=>{if(e.target.closest('[data-unpin]'))return;jumpTo(r.dataset.jump)});
    $('pBody').querySelectorAll('[data-unpin]').forEach(b=>b.onclick=()=>togglePin(b.dataset.unpin));
  }

    $('pTitle').textContent='Details';$('pSub').textContent='';
    let h='';
    if(c.type==='dm'&&!c.group){
      const o=U[c.members.find(m=>m!=='you')];
      h+=`<div class="prof-card">${av(o)}<b>${esc(o.n)}</b><span class="st2">${o.p==='on'?'Online':o.p==='away'?'Away':'Offline'}</span></div>`;
    }

    h+=c.members.map(id=>{const u=U[id];return `
      <div class="mrow">${dmav(u,'md')}
        <span class="pi"><b>${esc(u.n)}${u.id==='you'?' (you)':''}</b><span>${u.p==='on'?'Online':u.p==='away'?'Away':'Offline'}</span></span>

    if(c.type==='ch')h+=`<p class="p-note">${c.private?'Private channel — people join by invitation only.':'Public channel — anyone can find and join it from Browse channels.'}</p>`;
    $('pBody').innerHTML=h;

function simReply(){

  const who=others[Math.floor(Math.random()*others.length)];

}

function go(cid){
  if(S.cur!==cid){const old=conv();S.lastSeen[old.id]=old.msgs.length?Math.max(S.lastSeen[old.id],old.msgs[old.msgs.length-1].ts):S.lastSeen[old.id]}
  S.cur=cid;S.unread[cid]=0;
  if(S.panel==='thread'){S.panel=null;$('panel').classList.remove('on')}
  closeSide();

/* ============ Toasts ============ */
function toastIc(ic,text,opts={}){
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<svg class="tic" viewBox="0 0 24 24"></svg><span class="msg">${text}</span>`;
  t.querySelector('svg').outerHTML=I[ic]?I[ic].replace('<svg','<svg class="tic"'):'';
  wire(t,opts);return t;
}
function toastMsg(u,where,text,onOpen){
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`${av(u,'md')}<span class="msg"><b>${esc(u.n.split(' ')[0])} · ${esc(where)}</b><p>${esc(text)}</p></span><span class="ta"><button class="ok">Open</button></span>`;
  t.querySelector('.ok').onclick=()=>{t.remove();onOpen&&onOpen()};
  wire(t,{ms:5200});
}
function toastAct(html,actions,ic='bell'){
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`${I[ic].replace('<svg','<svg class="tic"')}<span class="msg">${html}</span><span class="ta"></span>`;
  const ta=t.querySelector('.ta');
  actions.forEach(a=>{const b=document.createElement('button');b.className=a.kind||'no';b.textContent=a.label;b.onclick=()=>{t.remove();a.fn&&a.fn()};ta.appendChild(b)});
  wire(t,{sticky:true});
  return ()=>t.remove();
}
function wire(t,opts){
  $('toasts').appendChild(t);
  if(!opts.sticky)later(()=>{t.classList.add('out');setTimeout(()=>t.remove(),240)},opts.ms||3400);
}

function setProfilePhoto(file){
  const rd=new FileReader();
  rd.onload=()=>{
    const src=rd.result;const img=new Image();
    img.onload=()=>{
      let out=src;
      try{
        const SZ=256,cv=document.createElement('canvas');cv.width=SZ;cv.height=SZ;
        const ctx=cv.getContext('2d');
        const sq=Math.min(img.width,img.height);
        ctx.drawImage(img,(img.width-sq)/2,(img.height-sq)/2,sq,sq,0,0,SZ,SZ);
        out=cv.toDataURL('image/jpeg',.85);
      }catch(e){}
      U.you.img=out;refreshAvatars();openSettings();
      toastIc('check','Profile photo updated — it shows on your messages and calls');
    };
    img.onerror=()=>{U.you.img=src;refreshAvatars();openSettings()};
    img.src=src;
  };
  rd.readAsDataURL(file);
}

function ensureDM(uid){
  let c=DB.convos.find(x=>x.type==='dm'&&!x.group&&x.members.includes(uid));
  if(!c){c={id:'d-'+uid,type:'dm',name:U[uid].n,members:['you',uid],joined:true,msgs:[]};DB.convos.push(c);S.lastSeen[c.id]=Date.now();S.unread[c.id]=0;renderSide()}
  return c;
}
function incomingCall(uid){
  if(INC){toastIc('phone','Someone is already ringing you');return}
  const u=U[uid];
  INC={uid,cd:null};
  const avp=$('incAv');avp.style.setProperty('--h',u.h);avp.querySelector('.c').innerHTML=avInner(u);
  $('incName').textContent=u.n;
  $('incReplies').classList.remove('on');$('incReplies').innerHTML='';
  let left=30;
  const sub=()=> (C.active?'Incoming while you\u2019re on a call · ':'Incoming voice call · ')+left+'s';
  $('incSub').textContent=sub();
  $('incbox').classList.add('on');
  ringStart(true,!!C.active);
  INC.cd=setInterval(()=>{left--;$('incSub').textContent=sub();if(left<=0)incEnd('missed')},1000);
}
function incClose(){if(INC){clearInterval(INC.cd);INC=null}ringStop();$('incbox').classList.remove('on')}
function incEnd(kind,msgText){
  if(!INC)return;
  const uid=INC.uid,u=U[uid];const dm=ensureDM(uid);
  incClose();
  if(kind==='missed'){
    postCallMsg(dm.id,'Missed call from '+u.n);
    toastMsg(u,'Missed call','They rang for 30 seconds',()=>go(dm.id));
  }
  if(kind==='decline'){postCallMsg(dm.id,'You declined a call from '+u.n)}
  if(kind==='msg'){
    postCallMsg(dm.id,'You declined a call from '+u.n);
    dm.msgs.push(Object.assign(M('you',msgText,0),{ts:Date.now()}));
    if(S.cur===dm.id){renderMsgs();animLast()}
    toastIc('check','Sent to '+esc(u.n.split(' ')[0])+': \u201C'+esc(msgText)+'\u201D',{ms:4600});
    later(()=>{
      dm.msgs.push(Object.assign(M(uid,'No problem — speak later 👍',0),{ts:Date.now()}));
      if(S.cur===dm.id){renderMsgs(true);animLast();ding()}else incoming(dm.id,uid);
    },2800);
  }
  if(kind==='accept'){
    if(C.active){
      if(C.members.length>=8){toastIc('bell','Your call is full — calls hold up to 8 people');postCallMsg(dm.id,'You declined a call from '+u.n);return}
      C.members.push(cmMake(u));boAdopt(uid);chime(true);renderCall();
      toastIc('phone','<b>'+esc(u.n)+'</b> merged into your call');
    } else {
      C.active=true;C.phase='in';C.convoId=dm.id;C.host=uid;C.sharing=null;C.min=false;
      C.members=[cmMake(U.you)];C.you={muted:false,hand:false};
      $('callov').classList.add('on');$('mini').classList.remove('on');
      $('cName').textContent=u.n;$('ringOut').classList.remove('on');
      C.members.push(cmMake(u));chime(true);beginCall();
    }
  }
}
$('incAccept').onclick=()=>incEnd('accept');
$('incDecline').onclick=()=>incEnd('decline');
$('incMsg').onclick=()=>{
  const r=$('incReplies');
  if(r.classList.contains('on')){r.classList.remove('on');return}
  r.classList.add('on');
  const Q=["I\u2019m on a call with a client — I\u2019ll ring you back","Can\u2019t talk right now, message me","Give me 5 minutes"];
  r.innerHTML=Q.map(q=>`<button class="inc-q">${q}</button>`).join('')+`<div class="inc-type"><input id="incIn" placeholder="Type a message…" maxlength="140"><button id="incSend">${I.send}</button></div>`;
  r.querySelectorAll('.inc-q').forEach(b=>b.onclick=()=>incEnd('msg',b.textContent));
  $('incSend').onclick=()=>{const v=$('incIn').value.trim();if(v)incEnd('msg',v)};
  $('incIn').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('incSend').click()}};
  setTimeout(()=>{const i=$('incIn');if(i)i.focus()},40);
};
function startGroup(c){
  C.active=true;C.phase='active';C.convoId=c.id;C.host='you';C.sharing=null;C.min=false;
  C.members=[cmMake(U.you)];C.you={muted:false,hand:false};
  $('callov').classList.add('on');$('mini').classList.remove('on');
  $('cName').textContent=c.type==='ch'?('#'+c.name):c.name;
  $('ringOut').classList.remove('on');
  beginCall();
  toastIc('phone','Call started — everyone in '+(c.type==='ch'?'#'+c.name:'the chat')+' can see it and join');
  const joiners=c.members.filter(m=>m!=='you'&&U[m].p!=='off').slice(0,5);
  joiners.forEach((id,i)=>cLater(()=>{if(!C.active)return;if(C.members.length>=8)return;C.members.push(cmMake(U[id]));boAdopt(id);chime(true);renderCall();toastIc('check','<b>'+esc(U[id].n)+'</b> joined the call')},1500+i*1700));
}
function beginCall(){
  C.phase='active';C.startedAt=Date.now();
  C.board=false;C.boardStrokes=[];C.pen={color:'#6C4DE6',size:4,eraser:false};C.rec=false;C.bo=null;BO.groups=[];$('bopanel').classList.remove('on');renderCPills();
  C.dur=setInterval(()=>{const s=fmt((Date.now()-C.startedAt)/1000);$('cDur').textContent=s;$('miDur').textContent=s;renderCPills()},1000);
  C.sim=setInterval(simSpeak,1500);
  renderCall();
}
function fmt(s){s=Math.max(0,Math.floor(s));const m=Math.floor(s/60),r=s%60;return(m<10?'0':'')+m+':'+(r<10?'0':'')+r}
function simSpeak(){
  if(!C.active||C.phase!=='active')return;
  const cands=C.members.filter(m=>m.id!=='you'&&!m.muted&&!m.ringing);
  if(cands.length&&Math.random()<.75){
    const m=cands[Math.floor(Math.random()*cands.length)];
    m.speaking=true;updSpeak();
    cLater(()=>{m.speaking=false;updSpeak()},1200+Math.random()*2000);
  }
  if(Math.random()<.05&&C.members.length>2){const m=cands[0];if(m)cReact(pick(EMO),m)}
}
function updSpeak(){
  document.querySelectorAll('.c-tile').forEach(t=>{const m=cm(t.dataset.id);if(m)t.classList.toggle('speaking',!!m.speaking&&!m.muted)});
}

const BO={groups:[]};
function allGroups(){return C.bo?C.bo.groups:BO.groups}
function inGroup(id){const g=allGroups().find(g=>g.ids.includes(id));return g||null}
function visMembers(){return C.bo?C.members.filter(m=>m.id==='you'||!C.bo.groups.some(g=>g.ids.includes(m.id))):C.members}
function boBannerHTML(){
  if(!C.bo)return'';

function toggleBoPanel(){
  const p=$('bopanel');
  if(p.classList.contains('on')){p.classList.remove('on');closeFloat();renderCallDock();return}
  if(C.host!=='you'){toastIc('rooms','Only the host manages breakout groups');return}
  if(C.members.filter(m=>!m.ringing).length<2){toastIc('rooms','Add at least one more person to the call first');return}
  if(!C.bo&&BO.groups.length===0)BO.groups=[{name:'Group 1',ids:[]}];

function renderBoPanel(){
  if(!$('bopanel').classList.contains('on'))return;

  let h='';

  h+=groups.map((g,gi)=>`<div class="bg-card" data-g="${gi}">
      <div class="bg-top"><b>${esc(g.name)}</b><span>${g.ids.length} ${g.ids.length===1?'person':'people'}</span><button class="bg-del" data-del="${gi}" title="Remove group">${I.x}</button></div>

  h+=`<div class="bo-sec">${live?'<span class="lv"></span>':''}MAIN ROOM — WITH YOU</div>`;

  $('boBody').innerHTML=h;
  const anyAllocated=groups.some(g=>g.ids.length);
  $('boFoot').innerHTML=live
    ? `<button class="go" id="boGo">Bring everyone back</button>`
    : `<button class="ghostb" id="boCancel">Close</button><button class="go" id="boGo" ${anyAllocated?'':'disabled'}>Open breakout rooms</button>`;
  $('boBody').querySelectorAll('[data-mv]:not(:disabled)').forEach(b=>b.onclick=e=>{e.stopPropagation();openMoveMenu(b,b.dataset.mv)});
  $('boBody').querySelectorAll('[data-addp]').forEach(b=>b.onclick=e=>{e.stopPropagation();openAddToGroup(b,+b.dataset.addp)});

    renderBoPanel();
  });
  $('boAdd').onclick=()=>{const gs=allGroups();if(gs.length>=6){toastIc('rooms','Six groups is the ceiling');return}gs.push({name:'Group '+(gs.length+1),ids:[]});if(live){renderCall()}renderBoPanel()};

    if(!gs.length)return;
    C.bo={groups:gs};chime(true);renderCall();renderCPills();renderBoPanel();renderCallDock();

function openMoveMenu(anchor,id){

function ringUser(id){
